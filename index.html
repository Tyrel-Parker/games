<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYREL'S ARCADE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell">

  <div id="header">
    <div id="insert-coin">— INSERT COIN —</div>
    <h1 id="title">TYREL'S ARCADE</h1>
  </div>

  <div id="select-label">▼ SELECT GAME ▼</div>

  <div id="game-grid">

    <!-- To add a new game: copy one of the .game-card blocks below.
         Set href to the game's subpath, e.g. href="mygame/" -->

    <a class="game-card" href="https://Tyrel-Parker.github.io/pacman">
      <div class="game-name">PAC-MAN</div>
      <div class="game-desc">CLASSIC MAZE CHASE</div>
      <div class="play-btn">PLAY</div>
    </a>

    <a class="game-card" href="https://Tyrel-Parker.github.io/zenithwing">
      <div class="game-name">ZENITHWING</div>
      <div class="game-desc">VERTICAL ARCADE SHOOTER</div>
      <div class="play-btn">PLAY</div>
    </a>

  </div>

  <div id="footer">tyrelparker.dev</div>

</div>
</body>
</html>
